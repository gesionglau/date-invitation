<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will you go on a date with me? 💕</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#fff0f3 0%,#fff5f8 40%,#fce4ec 100%);min-height:100vh;overflow-x:hidden}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
  @keyframes pulse-heart{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
  @keyframes confetti-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
  @keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
  @keyframes float-heart{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-120px) scale(0.3);opacity:0}}
  .glass{background:rgba(255,255,255,0.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,192,203,0.35);border-radius:24px;box-shadow:0 8px 40px rgba(220,80,120,0.10)}
  .btn-yes{background:linear-gradient(135deg,#f06292,#e91e8c);color:white;border:none;border-radius:50px;padding:16px 48px;font-size:20px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 6px 24px rgba(240,98,146,0.45);transition:transform 0.15s,box-shadow 0.15s;animation:pulse-heart 2s ease-in-out infinite}
  .btn-yes:hover{transform:scale(1.06);box-shadow:0 10px 32px rgba(240,98,146,0.6)}
  .btn-no{background:rgba(255,255,255,0.6);color:#c0627a;border:1.5px solid rgba(240,98,146,0.35);border-radius:50px;padding:10px 28px;font-size:15px;font-weight:400;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background 0.15s;position:fixed;z-index:999}
  .step-btn{background:linear-gradient(135deg,#f06292,#e91e8c);color:white;border:none;border-radius:50px;padding:14px 36px;font-size:16px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 4px 20px rgba(240,98,146,0.4);transition:transform 0.15s,box-shadow 0.15s}
  .step-btn:hover{transform:scale(1.04);box-shadow:0 8px 28px rgba(240,98,146,0.55)}
  .step-btn:disabled{opacity:0.45;cursor:not-allowed;transform:none}
  .step-btn-back{background:rgba(255,255,255,0.7);color:#c0627a;border:1.5px solid rgba(240,98,146,0.3);border-radius:50px;padding:14px 36px;font-size:16px;font-weight:400;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background 0.15s}
  .food-card{background:rgba(255,255,255,0.75);border:2px solid transparent;border-radius:20px;padding:24px 20px;cursor:pointer;transition:all 0.2s;text-align:center;backdrop-filter:blur(10px);box-shadow:0 4px 16px rgba(220,80,120,0.08)}
  .food-card:hover{transform:translateY(-4px);box-shadow:0 8px 28px rgba(240,98,146,0.22);border-color:rgba(240,98,146,0.4)}
  .food-card.selected{border-color:#f06292;background:rgba(255,182,193,0.3);box-shadow:0 8px 28px rgba(240,98,146,0.3)}
  .heart-bg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
  .progress-dot{width:12px;height:12px;border-radius:50%;border:2px solid #f06292;transition:all 0.3s}
  .progress-dot.active{background:#f06292;transform:scale(1.2)}
  .progress-dot.done{background:#f06292}
  input[type="date"],input[type="time"]{font-family:'DM Sans',sans-serif;border:1.5px solid rgba(240,98,146,0.3);border-radius:12px;padding:12px 16px;font-size:16px;background:rgba(255,255,255,0.8);color:#7a3050;width:100%;outline:none;transition:border-color 0.2s}
  input[type="date"]:focus,input[type="time"]:focus{border-color:#f06292;box-shadow:0 0 0 3px rgba(240,98,146,0.15)}
  .time-chip{background:rgba(255,255,255,0.75);border:1.5px solid rgba(240,98,146,0.25);border-radius:50px;padding:10px 20px;cursor:pointer;font-size:14px;color:#c0627a;font-family:'DM Sans',sans-serif;transition:all 0.2s}
  .time-chip.selected,.time-chip:hover{background:rgba(240,98,146,0.15);border-color:#f06292;color:#e91e8c}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

const EMAILJS_SERVICE_ID='service_ljg76tf';
const EMAILJS_TEMPLATE_ID='template_nhrybl2';
const EMAILJS_PUBLIC_KEY='uNXziMPW1_66VRU2E';
const CRUSH_EMAIL='jeexin123@gmail.com';

const FOOD_OPTIONS=[
  {id:'sushi',emoji:'🍣',label:'Sushi'},
  {id:'steak',emoji:'🥩',label:'Steak'},
  {id:'italian',emoji:'🍝',label:'Italian'},
  {id:'korean',emoji:'🔥',label:'Korean BBQ'},
  {id:'hotpot',emoji:'🍲',label:'Hotpot'},
  {id:'desserts',emoji:'🍰',label:'Desserts'},
  {id:'surprise',emoji:'🎁',label:'Surprise Me'},
];

const FUNNY_MSGS=[
  "Deploying relationship v1.0... ❤️",
  "Connection established ✨",
  "API response: YES 💌",
  "Pull request approved 🌸",
  "Merging hearts into main... 💞",
];

const NO_TAUNTS={3:"Nice try 😏",7:"You really want to say no? 🙈",12:"The answer is clearly yes. 💅"};

function FloatingHearts(){
  const hearts=["💕","💖","💗","💓","🌸","✨","💝","🌷","💞"];
  return(
    <div className="heart-bg">
      {Array.from({length:14},(_,i)=>(
        <div key={i} style={{
          position:'absolute',
          left:`${(i*7.3+5)%95}%`,
          top:`${(i*13+10)%90}%`,
          fontSize:`${16+i%22}px`,
          opacity:0.18+((i%5)*0.04),
          animation:`float ${4+i%4}s ease-in-out infinite`,
          animationDelay:`${i*0.4}s`,
          userSelect:'none',
        }}>{hearts[i%hearts.length]}</div>
      ))}
    </div>
  );
}

function Confetti(){
  const colors=['#f06292','#e91e8c','#ff8a80','#f48fb1','#fce4ec','#ff80ab','#ffb3c1'];
  const pieces=Array.from({length:60},(_,i)=>({
    id:i,
    color:colors[i%colors.length],
    left:`${Math.random()*100}%`,
    delay:`${Math.random()*2}s`,
    duration:`${2+Math.random()*2}s`,
    size:`${8+Math.random()*8}px`,
    rotate:Math.random()*360,
  }));
  return(
    <div style={{position:'fixed',inset:0,pointerEvents:'none',zIndex:9998}}>
      {pieces.map(p=>(
        <div key={p.id} style={{
          position:'absolute',left:p.left,top:'-20px',
          width:p.size,height:p.size,
          background:p.color,borderRadius:'2px',
          animation:`confetti-fall ${p.duration} ${p.delay} ease-in forwards`,
          transform:`rotate(${p.rotate}deg)`,
        }}/>
      ))}
    </div>
  );
}

function HeartBurst(){
  const [hearts,setHearts]=useState([]);
  useEffect(()=>{
    const h=Array.from({length:12},(_,i)=>({id:i,angle:(i/12)*360,emoji:['💖','💕','✨','🌸'][i%4]}));
    setHearts(h);
    setTimeout(()=>setHearts([]),1500);
  },[]);
  return(
    <div style={{position:'fixed',inset:0,pointerEvents:'none',zIndex:9997}}>
      {hearts.map(h=>(
        <div key={h.id} style={{
          position:'absolute',left:'50%',top:'50%',
          fontSize:'24px',
          animation:`float-heart 1.2s ease-out forwards`,
          transform:`translate(-50%,-50%) rotate(${h.angle}deg) translateX(${40+Math.random()*40}px)`,
          animationDelay:`${Math.random()*0.3}s`,
        }}>{h.emoji}</div>
      ))}
    </div>
  );
}

function ProgressBar({step}){
  const steps=['Food','Date','Time','Review'];
  return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'12px',marginBottom:'32px'}}>
      {steps.map((s,i)=>(
        <React.Fragment key={s}>
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'6px'}}>
            <div className={`progress-dot ${i<step?'done':i===step?'active':''}`}/>
            <span style={{fontSize:'11px',color:i<=step?'#e91e8c':'#c9a0b0',fontWeight:i===step?500:400}}>{s}</span>
          </div>
          {i<steps.length-1&&<div style={{width:'40px',height:'2px',background:i<step?'#f06292':'rgba(240,98,146,0.2)',borderRadius:'2px',marginBottom:'18px'}}/>}
        </React.Fragment>
      ))}
    </div>
  );
}

function LandingPage({onYes}){
  const [noPos,setNoPos]=useState({x:null,y:null});
  const [attempts,setAttempts]=useState(0);
  const [taunt,setTaunt]=useState('');
  const [showTaunt,setShowTaunt]=useState(false);
  const [showEgg,setShowEgg]=useState(false);
  const [score]=useState(Math.floor(90+Math.random()*10));
  const [showScore,setShowScore]=useState(false);
  const [funnyMsg]=useState(FUNNY_MSGS[Math.floor(Math.random()*FUNNY_MSGS.length)]);

  const randomPos=useCallback((att)=>{
    const padding=80;
    const vw=window.innerWidth;
    const vh=window.innerHeight;
    const cx=vw/2;
    const cy=vh/2;
    let x,y,tries=0;
    do{
      x=padding+Math.random()*(vw-padding*2);
      y=padding+Math.random()*(vh-padding*2);
      tries++;
    }while(tries<20&&Math.abs(x-cx)<200&&Math.abs(y-cy)<200);
    return{x:Math.min(Math.max(x,padding),vw-padding),y:Math.min(Math.max(y,padding),vh-padding)};
  },[]);

  const moveNo=useCallback(()=>{
    setAttempts(a=>{
      const next=a+1;
      if(NO_TAUNTS[next]){
        setTaunt(NO_TAUNTS[next]);
        setShowTaunt(true);
        setTimeout(()=>setShowTaunt(false),2000);
      }
      setNoPos(randomPos(next));
      return next;
    });
  },[randomPos]);

  useEffect(()=>{
    setNoPos({x:window.innerWidth/2+160,y:window.innerHeight/2+40});
  },[]);

  const handleYes=()=>{
    setShowScore(true);
    setTimeout(()=>{setShowScore(false);onYes();},1800);
  };

  return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',position:'relative'}}>
      <FloatingHearts/>
      <div style={{position:'relative',zIndex:10,textAlign:'center',padding:'24px',animation:'fadeInUp 0.8s ease-out'}}>
        <div className="glass" style={{padding:'48px 52px',maxWidth:'480px',margin:'0 auto'}}>
          <div style={{fontSize:'52px',marginBottom:'16px',animation:'pulse-heart 2s ease-in-out infinite'}}>💕</div>
          <h1 style={{fontFamily:'Playfair Display',fontSize:'clamp(26px,5vw,36px)',color:'#b5274e',fontWeight:700,lineHeight:1.3,marginBottom:'12px'}}>
            Will you go on a date with me?
          </h1>
          <p style={{color:'#c0627a',fontSize:'15px',marginBottom:'8px',fontStyle:'italic'}}>
            I built an entire app just to ask this question.
          </p>
          <p style={{color:'#e91e8c',fontSize:'13px',marginBottom:'36px',opacity:0.8}}>{funnyMsg}</p>
          <div style={{display:'flex',justifyContent:'center',marginBottom:'8px'}}>
            <button className="btn-yes" onClick={handleYes} aria-label="Yes, I'd love to go on a date">
              Yes ❤️
            </button>
          </div>
          <p style={{fontSize:'12px',color:'#e2a0b5',marginTop:'12px'}}>Compatibility Score: {score}% ❤️</p>
        </div>
      </div>

      {noPos.x!==null&&(
        <button
          className="btn-no"
          style={{
            left:`${noPos.x}px`,top:`${noPos.y}px`,
            transform:'translate(-50%,-50%)',
            transition:`left ${attempts<6?0.25:attempts<11?0.15:0.08}s cubic-bezier(0.34,1.56,0.64,1), top ${attempts<6?0.25:attempts<11?0.15:0.08}s cubic-bezier(0.34,1.56,0.64,1)`
          }}
          onMouseEnter={moveNo}
          onTouchStart={moveNo}
          onClick={()=>setShowEgg(true)}
          aria-label="No thank you"
        >No 🙈</button>
      )}

      {showTaunt&&(
        <div style={{position:'fixed',bottom:'80px',left:'50%',transform:'translateX(-50%)',background:'rgba(255,255,255,0.9)',borderRadius:'50px',padding:'10px 24px',color:'#e91e8c',fontSize:'15px',fontWeight:500,zIndex:1000,boxShadow:'0 4px 20px rgba(240,98,146,0.25)',animation:'fadeInUp 0.3s ease-out'}}>
          {taunt}
        </div>
      )}

      {showScore&&(
        <div style={{position:'fixed',inset:0,background:'rgba(255,240,245,0.9)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:2000,animation:'fadeInUp 0.3s'}}>
          <div className="glass" style={{padding:'40px',textAlign:'center',animation:'pop 0.4s ease-out'}}>
            <div style={{fontSize:'60px',marginBottom:'12px'}}>💖</div>
            <div style={{fontFamily:'Playfair Display',fontSize:'32px',color:'#e91e8c',fontWeight:700}}>Compatibility Score</div>
            <div style={{fontSize:'56px',fontWeight:700,color:'#b5274e',margin:'8px 0'}}>{score}%</div>
            <div style={{color:'#c0627a'}}>The universe says yes 🌸</div>
          </div>
        </div>
      )}

      {showEgg&&(
        <div style={{position:'fixed',inset:0,background:'rgba(255,240,245,0.92)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:3000}} onClick={()=>{setShowEgg(false);onYes();}}>
          <div className="glass" style={{padding:'40px',textAlign:'center',maxWidth:'360px',animation:'pop 0.4s ease-out'}}>
            <div style={{fontSize:'48px',marginBottom:'12px'}}>😱</div>
            <div style={{fontFamily:'Playfair Display',fontSize:'24px',color:'#b5274e',fontWeight:700,marginBottom:'12px'}}>That button actually works?!</div>
            <p style={{color:'#c0627a',marginBottom:'20px'}}>Well... it doesn't matter. The answer is still yes. 💕</p>
            <button className="btn-yes" style={{animation:'none'}}>Fine, let's do it! ❤️</button>
          </div>
        </div>
      )}
    </div>
  );
}

function StepFood({value,onChange}){
  return(
    <div>
      <h2 style={{fontFamily:'Playfair Display',fontSize:'28px',color:'#b5274e',marginBottom:'8px',textAlign:'center'}}>What should we eat? 🍽️</h2>
      <p style={{color:'#c0627a',textAlign:'center',marginBottom:'28px',fontSize:'15px'}}>Pick your dream cuisine</p>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(130px,1fr))',gap:'14px'}}>
        {FOOD_OPTIONS.map(f=>(
          <div key={f.id} className={`food-card ${value===f.id?'selected':''}`} onClick={()=>onChange(f.id)} role="button" aria-pressed={value===f.id} tabIndex={0}>
            <div style={{fontSize:'36px',marginBottom:'8px'}}>{f.emoji}</div>
            <div style={{fontSize:'14px',color:'#7a3050',fontWeight:500}}>{f.label}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function StepDate({value,onChange}){
  const today=new Date().toISOString().split('T')[0];
  return(
    <div>
      <h2 style={{fontFamily:'Playfair Display',fontSize:'28px',color:'#b5274e',marginBottom:'8px',textAlign:'center'}}>When should our date be? 📅</h2>
      <p style={{color:'#c0627a',textAlign:'center',marginBottom:'28px',fontSize:'15px'}}>Pick a magical day</p>
      <div style={{display:'flex',justifyContent:'center'}}>
        <input type="date" min={today} value={value} onChange={e=>onChange(e.target.value)} style={{maxWidth:'280px'}}/>
      </div>
    </div>
  );
}

function StepTime({value,onChange}){
  const chips=[{label:'Lunch ☀️',val:'12:00'},{label:'Coffee ☕',val:'15:00'},{label:'Dinner 🌙',val:'19:00'},{label:'Night Dessert 🍮',val:'21:00'}];
  return(
    <div>
      <h2 style={{fontFamily:'Playfair Display',fontSize:'28px',color:'#b5274e',marginBottom:'8px',textAlign:'center'}}>What time works best? ⏰</h2>
      <p style={{color:'#c0627a',textAlign:'center',marginBottom:'24px',fontSize:'15px'}}>Choose a time or pick your own</p>
      <div style={{display:'flex',flexWrap:'wrap',gap:'10px',justifyContent:'center',marginBottom:'24px'}}>
        {chips.map(c=>(
          <button key={c.val} className={`time-chip ${value===c.val?'selected':''}`} onClick={()=>onChange(c.val)}>{c.label}</button>
        ))}
      </div>
      <div style={{display:'flex',justifyContent:'center'}}>
        <input type="time" value={value} onChange={e=>onChange(e.target.value)} style={{maxWidth:'200px'}}/>
      </div>
    </div>
  );
}

function StepReview({food,date,time}){
  const foodObj=FOOD_OPTIONS.find(f=>f.id===food)||{emoji:'🍽️',label:'TBD'};
  const fmtDate=date?new Date(date+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}):'Not set';
  const fmtTime=time?new Date(`2000-01-01T${time}`).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true}):'Not set';
  return(
    <div>
      <h2 style={{fontFamily:'Playfair Display',fontSize:'28px',color:'#b5274e',marginBottom:'24px',textAlign:'center'}}>Ready to make this official? ❤️</h2>
      <div style={{background:'rgba(255,182,193,0.2)',borderRadius:'20px',padding:'28px',marginBottom:'20px',border:'1px solid rgba(240,98,146,0.2)'}}>
        {[{label:'Food',val:`${foodObj.emoji} ${foodObj.label}`},{label:'Date',val:`📅 ${fmtDate}`},{label:'Time',val:`⏰ ${fmtTime}`}].map(r=>(
          <div key={r.label} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 0',borderBottom:'1px solid rgba(240,98,146,0.15)'}}>
            <span style={{color:'#c0627a',fontSize:'14px'}}>{r.label}</span>
            <span style={{color:'#7a3050',fontWeight:500,fontSize:'16px'}}>{r.val}</span>
          </div>
        ))}
      </div>
      <p style={{color:'#c0627a',textAlign:'center',fontSize:'14px',fontStyle:'italic'}}>This will be the most beautiful date in history 🌹</p>
    </div>
  );
}

function DateWizard({onComplete}){
  const [step,setStep]=useState(0);
  const [food,setFood]=useState('');
  const [date,setDate]=useState('');
  const [time,setTime]=useState('');
  const [sending,setSending]=useState(false);
  const [sendError,setSendError]=useState('');
  const [confetti,setConfetti]=useState(false);

  const canNext=[!!food,!!date,!!time,true][step];

  const foodObj=FOOD_OPTIONS.find(f=>f.id===food)||{emoji:'🍽️',label:'TBD'};
  const fmtDate=date?new Date(date+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}):'TBD';
  const fmtTime=time?new Date(`2000-01-01T${time}`).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true}):'TBD';

  const sendEmail=async()=>{
    setSending(true);
    setSendError('');
    try{
      await emailjs.send(
        EMAILJS_SERVICE_ID,
        EMAILJS_TEMPLATE_ID,
        {
          to_email: CRUSH_EMAIL,
          food: `${foodObj.emoji} ${foodObj.label}`,
          date: fmtDate,
          time: fmtTime,
        },
        EMAILJS_PUBLIC_KEY
      );
      setConfetti(true);
      setTimeout(()=>{setConfetti(false);onComplete({food,date,time});},2000);
    }catch(err){
      console.error('EmailJS error:',err);
      setSendError('Hmm, the email failed to send. Please try again 💌');
    }finally{
      setSending(false);
    }
  };

  const next=()=>{
    if(step<3) setStep(s=>s+1);
    else sendEmail();
  };

  const stepComp=[
    <StepFood value={food} onChange={setFood}/>,
    <StepDate value={date} onChange={setDate}/>,
    <StepTime value={time} onChange={setTime}/>,
    <StepReview food={food} date={date} time={time}/>,
  ][step];

  return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',position:'relative'}}>
      <FloatingHearts/>
      {confetti&&<Confetti/>}
      <div style={{position:'relative',zIndex:10,width:'100%',maxWidth:'560px',padding:'24px',animation:'fadeInUp 0.5s ease-out'}}>
        <div className="glass" style={{padding:'40px 36px'}}>
          <ProgressBar step={step}/>
          <div key={step} style={{animation:'fadeInUp 0.4s ease-out'}}>
            {stepComp}
          </div>
          {sendError&&(
            <p style={{color:'#e91e8c',fontSize:'14px',textAlign:'center',marginTop:'16px'}}>{sendError}</p>
          )}
          <div style={{display:'flex',gap:'12px',justifyContent:'center',marginTop:'32px'}}>
            {step>0&&<button className="step-btn-back" onClick={()=>setStep(s=>s-1)} disabled={sending}>← Back</button>}
            <button className="step-btn" onClick={next} disabled={!canNext||sending}>
              {sending ? '💌 Sending...' : step===3 ? 'Confirm & Send 💕' : 'Next →'}
            </button>
          </div>
          {step===3&&(
            <p style={{color:'#c0627a',fontSize:'12px',textAlign:'center',marginTop:'12px',opacity:0.8}}>
              A confirmation email will be sent to your date 💌
            </p>
          )}
        </div>
      </div>
    </div>
  );
}

function ConfirmationScreen({data}){
  const foodObj=FOOD_OPTIONS.find(f=>f.id===data.food)||{emoji:'🍽️',label:'Surprise'};
  const fmtDate=data.date?new Date(data.date+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}):'TBD';
  const fmtTime=data.time?new Date(`2000-01-01T${data.time}`).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true}):'TBD';
  return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',position:'relative'}}>
      <FloatingHearts/>
      <Confetti/>
      <HeartBurst/>
      <div style={{position:'relative',zIndex:10,textAlign:'center',padding:'24px',animation:'pop 0.5s ease-out',maxWidth:'480px',width:'100%'}}>
        <div className="glass" style={{padding:'48px 40px'}}>
          <div style={{fontSize:'64px',marginBottom:'12px',animation:'pulse-heart 1.5s ease-in-out infinite'}}>🎉</div>
          <h1 style={{fontFamily:'Playfair Display',fontSize:'36px',color:'#b5274e',fontWeight:700,marginBottom:'12px'}}>YAY!</h1>
          <p style={{color:'#c0627a',fontSize:'18px',marginBottom:'8px',fontStyle:'italic'}}>You just made me the happiest person alive.</p>
          <p style={{color:'#e2a0b5',fontSize:'13px',marginBottom:'28px'}}>A confirmation email has been sent 💌</p>
          <div style={{background:'rgba(255,182,193,0.2)',borderRadius:'20px',padding:'24px',textAlign:'left',border:'1px solid rgba(240,98,146,0.2)'}}>
            {[{label:"We're eating",val:`${foodObj.emoji} ${foodObj.label}`},{label:'On',val:`📅 ${fmtDate}`},{label:'At',val:`⏰ ${fmtTime}`}].map(r=>(
              <div key={r.label} style={{display:'flex',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px solid rgba(240,98,146,0.1)'}}>
                <span style={{color:'#c0627a',fontSize:'14px'}}>{r.label}</span>
                <span style={{color:'#7a3050',fontWeight:500}}>{r.val}</span>
              </div>
            ))}
          </div>
          <div style={{marginTop:'24px',display:'flex',justifyContent:'center',gap:'12px',fontSize:'28px',animation:'float 3s ease-in-out infinite'}}>
            💕 🌸 💖 🌹 ✨
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [screen,setScreen]=useState('landing');
  const [dateData,setDateData]=useState(null);
  const [burst,setBurst]=useState(false);

  useEffect(()=>{
    emailjs.init(EMAILJS_PUBLIC_KEY);
  },[]);

  const handleYes=()=>{setBurst(true);setTimeout(()=>{setBurst(false);setScreen('wizard');},800)};
  const handleComplete=(data)=>{setDateData(data);setScreen('confirm');};

  return(
    <div>
      {burst&&<><Confetti/><HeartBurst/></>}
      {screen==='landing'&&<LandingPage onYes={handleYes}/>}
      {screen==='wizard'&&<DateWizard onComplete={handleComplete}/>}
      {screen==='confirm'&&<ConfirmationScreen data={dateData}/>}
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
